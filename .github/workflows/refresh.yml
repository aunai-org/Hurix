# Every hour, and on every push to main: fetch the latest satellite slot, build the site with it, and upload it to
# Cloudflare Pages. Needs the repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID. The first run creates the Pages project "hurrix".
name: Hourly refresh
on:
  schedule:
    - cron: "5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch, process and build
        shell: bash
        run: |
          sh scripts/refresh-live.sh "$RUNNER_TEMP/live" | tee "$RUNNER_TEMP/refresh.log"
          STAGE=$(tail -n 1 "$RUNNER_TEMP/refresh.log")
          cp "$STAGE/dist/_headers" "$STAGE/site/"  # security and cache headers
          echo "SITE=$STAGE/site" >> "$GITHUB_ENV"
          tail -n 2 "$RUNNER_TEMP/refresh.log" | head -n 1 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -q ' hurrix ' \
            || npx --yes wrangler@4 pages project create hurrix --production-branch main
          npx --yes wrangler@4 pages deploy "$SITE" --project-name hurrix --branch main --commit-dirty=true
